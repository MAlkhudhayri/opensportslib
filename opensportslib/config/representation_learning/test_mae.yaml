TASK: representation_learning

REPRESENTATION:
  method: mae
  mae:
    mask_ratio: 0.75
    mask_type: tube
    norm_pix_loss: true

DATA:
  data_dir: /ibex/scratch/alkhudmk/ssl_test_data/train
  num_frames: 16
  frame_size: [224, 224]
  patch_size: 16
  tubelet_size: 2
  batch_size: 4
  num_workers: 2
  input_fps: null
  target_fps: null
  augmentations:
    random_horizontal_flip: false
    color_jitter: false
    random_crop: false

MODEL:
  encoder:
    type: vit_tiny_test
    embed_dim: 192
    depth: 2
    num_heads: 3
  decoder:
    depth: 1
    embed_dim: 96
    num_heads: 3

TRAIN:
  epochs: 3
  save_every: 1
  optimizer:
    type: AdamW
    lr: 0.0001
    betas: [0.9, 0.95]
    eps: 0.00000001
    weight_decay: 0.05
    amsgrad: false
  scheduler:
    type: CosineAnnealingLR
    T_max: 3
  warmup_epochs: 1
  save_backbone_only: true

SYSTEM:
  log_dir: ./logs
  save_dir: /ibex/scratch/alkhudmk/ssl_test_checkpoints
  use_seed: true
  seed: 42
  GPU: 1
  device: cuda
  gpu_id: 0
